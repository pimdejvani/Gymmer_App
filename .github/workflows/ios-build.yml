name: iOS build

# Builds the Flutter iOS app on a macOS runner. Unsigned build — proves the app
# compiles for iOS without needing an Apple Developer account. Runs on push to
# main/ios, on iOS-affecting PRs, and can be triggered manually.
on:
  push:
    branches: [main, ios]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-15
    defaults:
      run:
        working-directory: gymmer_flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      # Package the unsigned .app into an .ipa (Payload/ zip). Not code-signed —
      # AltStore/SideStore re-signs it with a free Apple ID when sideloading.
      - name: Package unsigned IPA
        working-directory: gymmer_flutter/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r9 Gymmer.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: Gymmer-ipa
          path: gymmer_flutter/build/ios/iphoneos/Gymmer.ipa
          if-no-files-found: error
