name: iOS build

# Test Dart and native App Intents in parallel with the release build. Publishing
# waits for all three jobs, so faster feedback doesn't trade away release safety.
on:
  push:
    branches: [main, ios]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'gymmer_flutter/**'
      - '!gymmer_flutter/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'gymmer_flutter/**'
      - '!gymmer_flutter/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-tests:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymmer_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

  native-intent-tests:
    name: Native App Intent tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gymmer_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure iOS project
        run: flutter build ios --debug --simulator --no-pub --config-only

      - name: Select an iPhone simulator
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries | sort_by(.key) | reverse | map(.value[] | select(.name | startswith("iPhone")) | .udid) | first')
          test -n "$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep -F "$DEVICE_ID"

      # Keep build and execution separate so a slow macOS runner is immediately
      # distinguishable from a simulator/test hang in the Actions timeline.
      - name: Build native tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/RunnerDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO

      - name: Execute native tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/RunnerDerivedData" \
            -only-testing:RunnerTests \
            -resultBundlePath "$RUNNER_TEMP/RunnerTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO

      - name: Upload native test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v5
        with:
          name: native-test-diagnostics-${{ github.run_number }}
          path: ${{ runner.temp }}/RunnerTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  build-ios:
    name: Build unsigned iOS app
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    defaults:
      run:
        working-directory: gymmer_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore incremental iOS build cache
        uses: actions/cache@v5
        with:
          path: gymmer_flutter/build/ios
          key: ios-release-v2-${{ runner.os }}-${{ runner.arch }}-flutter-3.44.4-${{ hashFiles('gymmer_flutter/pubspec.lock', 'gymmer_flutter/ios/Podfile.lock', 'gymmer_flutter/ios/Runner.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ios-release-v2-${{ runner.os }}-${{ runner.arch }}-flutter-3.44.4-

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --no-pub --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      # Embed the App Group + HealthKit requests for SideStore to re-provision.
      - name: Embed requested entitlements (ad-hoc)
        run: |
          APP=build/ios/iphoneos/Runner.app
          for appex in "$APP"/PlugIns/*.appex; do
            [ -e "$appex" ] || continue
            codesign --force --sign - \
              --entitlements ios/GymmerWidget/GymmerWidget.entitlements \
              "$appex" \
              && echo "signed $(basename "$appex")" \
              || echo "appex sign failed: $(basename "$appex")"
          done
          codesign --force --sign - \
            --entitlements ios/Runner/Runner.entitlements \
            "$APP" \
            && echo "ad-hoc entitlement embed OK" \
            || echo "ad-hoc embed failed — continuing with unsigned .app"

      - name: Package unsigned IPA
        working-directory: gymmer_flutter/build/ios/iphoneos
        run: |
          rm -rf Payload Gymmer.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr6 Gymmer.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: Gymmer-ipa
          path: gymmer_flutter/build/ios/iphoneos/Gymmer.ipa
          if-no-files-found: error

  publish-ios:
    name: Publish tested iOS release
    if: github.event_name == 'push'
    needs: [flutter-tests, native-intent-tests, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download tested IPA
        uses: actions/download-artifact@v5
        with:
          name: Gymmer-ipa
          path: gymmer_flutter/build/ios/iphoneos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: gymmer_flutter/build/ios/iphoneos/Gymmer.ipa

      - name: Generate SideStore source (apps.json)
        run: |
          IPA="gymmer_flutter/build/ios/iphoneos/Gymmer.ipa"
          SIZE=$(stat -c%s "$IPA")
          DATE=$(date -u +%Y-%m-%d)
          URL="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/Gymmer.ipa"
          ICON="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/gymmer_flutter/assets/Gymmer_Logo.png"
          jq -n \
            --arg ver "1.0.${{ github.run_number }}" \
            --arg date "$DATE" \
            --arg url "$URL" \
            --arg icon "$ICON" \
            --argjson size "$SIZE" \
            '{
              name: "Gymmer",
              identifier: "com.gymmer.sidestore-source",
              apps: [{
                name: "Gymmer",
                bundleIdentifier: "com.gymmer.gymmerFlutter",
                developerName: "pimdej",
                version: $ver,
                versionDate: $date,
                downloadURL: $url,
                localizedDescription: "Offline iPhone-first workout tracker.",
                iconURL: $icon,
                tintColor: "6C3EF5",
                size: $size
              }]
            }' > apps.json

      - name: Commit apps.json back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --staged --quiet || git commit -m "Update SideStore source to build ${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
